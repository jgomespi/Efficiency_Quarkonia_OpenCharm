# Input samples for the J/psi + D* efficiency calculation.
#
# dimu_cut is the lower generator-level J/psi pT limit appropriate
# for that production.
#
# 2017 is the validated reference production.
# 2018 is the current convener-analysis extension.
# 2016APV/2016 remain intentionally empty while the corresponding
# productions/tape recalls are in progress. When they become available,
# only this file needs to be extended; the driver already supports them.
#
# 2018 policy: scripts/prepare_caltech_2018_inputs.py resolves the exact
# configured Caltech CRAB terminal folders, de-duplicates logical ROOT paths,
# validates representative ROOTs for the NanoAODPlus analysis branches, and
# freezes the exact URLs in inputs/caltech/*.txt. The physics driver consumes
# only those frozen lists. File multiplicities are discovered at runtime and
# are not hard-coded here.

samples:

  DPS-ccbar:
    "2016APV": []
    "2016": []
    "2017":
      - path: /eos/user/m/mabarros/Monte_Carlo/dps_official/ccbar/JpsiPt9To30ToMuMuDstarToD0pi_2017
        dimu_cut: 9.0
      - path: /eos/user/m/mabarros/Monte_Carlo/dps_official/ccbar/JpsiPt30To50ToMuMuDstarToD0pi_2017
        dimu_cut: 30.0
      - path: /eos/user/m/mabarros/Monte_Carlo/dps_official/ccbar/JpsiPt50To100ToMuMuDstarToD0pi_2017
        dimu_cut: 50.0
    "2018":
      - filelist: inputs/caltech/DPS-ccbar_2018_9to30.txt
        dimu_cut: 9.0
      - filelist: inputs/caltech/DPS-ccbar_2018_30to50.txt
        dimu_cut: 30.0
      - filelist: inputs/caltech/DPS-ccbar_2018_50to100.txt
        dimu_cut: 50.0

  DPS-bbbar:
    "2016APV": []
    "2016": []
    "2017":
      - path: /eos/user/m/mabarros/Monte_Carlo/dps_official/bbbar/JpsiPt9To30ToMuMuDstarToD0pi_2017
        dimu_cut: 9.0
      - path: /eos/user/m/mabarros/Monte_Carlo/dps_official/bbbar/JpsiPt30To50ToMuMuDstarToD0pi_2017
        dimu_cut: 30.0
      - path: /eos/user/m/mabarros/Monte_Carlo/dps_official/bbbar/JpsiPt50To100ToMuMuDstarToD0pi_2017
        dimu_cut: 50.0
    "2018":
      - filelist: inputs/caltech/DPS-bbbar_2018_9to30.txt
        dimu_cut: 9.0
      - filelist: inputs/caltech/DPS-bbbar_2018_30to50.txt
        dimu_cut: 30.0
      - filelist: inputs/caltech/DPS-bbbar_2018_50to100.txt
        dimu_cut: 50.0

  SPS-ccbar:
    "2016APV": []
    "2016": []
    "2017":
      - path: /eos/user/s/sfonseca/LHE_SPS/jpsi_ccbar_25to100_3FS_SPS_2017_nanoaodplus
        dimu_cut: 25.0
        recursive: true
    "2018":
      - filelist: inputs/caltech/SPS-ccbar_2018.txt
        dimu_cut: 25.0

  SPS-bbbar:
    "2016APV": []
    "2016": []
    "2017":
      - path: /eos/user/s/sfonseca/LHE_SPS/jpsi_bbbar_25to100_3FS_SPS_2017_nanoaodplus
        dimu_cut: 25.0
        recursive: true
    "2018":
      - filelist: inputs/caltech/SPS-bbbar_2018.txt
        dimu_cut: 25.0
