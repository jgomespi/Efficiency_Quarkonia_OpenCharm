  SPS-ccbar:
    "2016APV": []
    "2016": []
    "2017":
      - path: /eos/user/s/sfonseca/LHE_SPS/jpsi_ccbar_25to100_3FS_SPS_2017_nanoaodplus
        dimu_cut: 25.0
        recursive: true
    "2018":
      - dimu_cut: 25.0
        xrootd:
          redirector: k8s-redir.ultralight.org:1094
